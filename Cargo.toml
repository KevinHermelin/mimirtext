[package]
name = "mimir"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
edit = "0.1.5"
open = "5.3.2"
pulldown-cmark = { version = "0.13.0", default-features = false }
rapidfuzz = "0.5.0"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
insta = "1.43.1"
tempfile = "3.21.0"
